name: Tag release

# When a push to main raises the workspace version in Cargo.toml: tags the
# commit as v<version>, creates the release and builds it. Pushes that leave
# the version at an already tagged one do nothing.

on:
  push:
    branches: [main]
    paths: [Cargo.toml]

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and create release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version
        id: version
        run: |
          version=$(awk '
            /^\[/ { section = $0 }
            section == "[workspace.package]" && /^version *=/ {
              gsub(/version *= *|"/, ""); print; exit
            }' Cargo.toml)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Workspace version '$version' is not a version such as 1.2.0"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # The build runs with --locked; a version bump without the matching
      # Cargo.lock would create a release that never gets its programs.
      - name: Check Cargo.lock is up to date
        run: |
          if ! cargo update --workspace --locked; then
            echo "::error::Cargo.lock does not match Cargo.toml; run 'cargo update --workspace' and commit Cargo.lock"
            exit 1
          fi

      # Normal releases, not pre-releases: the desktop updater asks for
      # /releases/latest, which skips pre-releases.
      - name: Create tag and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build and attach
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
