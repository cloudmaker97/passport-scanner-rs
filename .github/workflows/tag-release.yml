name: Tag release

# When a push to main raises the workspace version in Cargo.toml: tags the
# commit as v<version>, creates the release and builds it. Pushes that leave
# the version at an already released one do nothing. Can be started by hand,
# e.g. to finish a release whose build failed.

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and create release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version
        id: version
        run: |
          version=$(awk '
            /^\[/ { section = $0 }
            section == "[workspace.package]" && /^version *=/ {
              gsub(/version *= *|"/, ""); print; exit
            }' Cargo.toml)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Workspace version '$version' is not a version such as 1.2.0"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # The build runs with --locked; a version bump without the matching
      # Cargo.lock would create a release that never gets its programs.
      - name: Check Cargo.lock is up to date
        run: |
          if ! cargo update --workspace --locked; then
            echo "::error::Cargo.lock does not match Cargo.toml; run 'cargo update --workspace' and commit Cargo.lock"
            exit 1
          fi

      # The release starts as a draft, which neither visitors nor the desktop
      # updater see; release.yml publishes it once the programs are attached.
      # A failed build leaves tag and draft behind, and running this again
      # picks them up. Normal releases, not pre-releases: the updater asks
      # for /releases/latest, which skips pre-releases.
      - name: Create tag and draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = "false" ]; then
            echo "$TAG is already released; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tagged=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$tagged" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          elif [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG already points to $tagged, not $GITHUB_SHA; delete the tag and its draft release, then run this again"
            exit 1
          fi

          if [ -z "$draft" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "$TAG" --generate-notes
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish
    needs: tag
    if: needs.tag.outputs.build == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
