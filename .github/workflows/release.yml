name: Release

# When a release is published: builds the programs for Windows, macOS and
# Linux and the user guide PDF, puts the guide into each program archive and
# attaches the archives, the guide and the licence to the release. The desktop
# program finds its archive there to update itself. Can be started by hand for
# an existing release tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to
        required: true
  # tag-release.yml creates releases with the workflow token, which does not
  # raise the published event above, so it calls this workflow directly.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach to
        type: string
        required: true

permissions:
  contents: write

jobs:
  user-guide:
    name: User guide PDF
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Pinned: the page design in docs/user/handbook.typ follows these versions.
      - name: Install pandoc and Typst
        run: |
          curl -fsSL -o pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.12.1/pandoc-3.12.1-1-amd64.deb
          sudo dpkg -i pandoc.deb
          curl -fsSL \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          pandoc --version | head -1
          typst --version

      - name: Build PDF
        run: VERSION="${TAG#v}" bash scripts/build-user-guide.sh dist/Passport-Scanner-User-Guide.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: user-guide
          path: dist/Passport-Scanner-User-Guide.pdf
          if-no-files-found: error

  build:
    name: Programs
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}

  publish:
    name: Attach to release
    needs: [user-guide, build]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: user-guide
          path: release

      # Each archive is the whole program folder; the guide belongs in it.
      - name: Add the guide to each archive
        working-directory: release
        run: |
          for archive in passport-scanner-*.zip; do
            python3 - "$archive" <<'EOF'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1], "a", zipfile.ZIP_DEFLATED) as archive:
              archive.write("Passport-Scanner-User-Guide.pdf")
          EOF
          done
          ls -la

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: source
          sparse-checkout: LICENSE
          sparse-checkout-cone-mode: false

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release/passport-scanner-*.zip \
            release/Passport-Scanner-User-Guide.pdf \
            source/LICENSE.txt

      # tag-release.yml creates drafts; only now, with the programs attached,
      # may the release reach visitors and the desktop updater.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
