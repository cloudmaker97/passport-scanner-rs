[package]
name = "passport-scanner-capture"
description = "Frame capture over the platform's camera stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
passport-scanner-core.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10", features = ["input-msmf"] }

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10", features = ["input-v4l"] }

[lints]
workspace = true
