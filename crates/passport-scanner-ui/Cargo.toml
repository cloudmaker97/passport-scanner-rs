[package]
name = "passport-scanner-ui"
description = "Shared Iced interface for the Passport Scanner desktop and web clients"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true

[features]
# Explicit developer-only capture through Iced's renderer; native only.
render-smoke = []

[dependencies]
passport-scanner-protocol.workspace = true
serde_json.workspace = true
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "image-without-codecs", "fira-sans", "crisp", "canvas"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"

# The browser runs futures through wasm-bindgen; natively Iced needs an executor.
# Natively the GPU draws, which keeps scrolling smooth on a large window;
# tiny-skia remains the fallback where no GPU adapter is available.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { version = "0.14", default-features = false, features = ["tokio", "wgpu"] }

# Without a windowing backend softbuffer (under tiny-skia) has nothing to draw to on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.14", default-features = false, features = ["x11", "wayland"] }

[dev-dependencies]
# Exercise the exact EXIF-aware loader used by Iced's tiny-skia renderer.
iced_graphics = { version = "0.14", features = ["image"] }

[lints]
workspace = true
